services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "calendar,confluence,github,gmail,jira,slack"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - calendar.local.mock
          - confluence.local.mock
          - github.local.mock
          - gmail.local.mock
          - jira.local.mock
          - slack.local.mock
          - search.local.mock
