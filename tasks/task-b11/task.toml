[task]
name = "taskgen/task-b11"
description = "Salesforce compromised connected-app / CRM data-exfiltration account-takeover containment, graded as a bidirectional needle-field at volume on the Salesforce `User.IsActive` field plus a rogue `ConnectedApplication` floor. An offensively-framed active incident (an actor stole a connected app's OAuth token and is bulk-exporting Accounts/Opportunities/Contacts; lock down every confirmed-compromised identity and kill the rogue app) hides two directions of the same primitive: 8 ON-PATH items the framing prompts (7 confirmed-compromised User accounts the overnight Salesforce Shield auto-freeze missed are still IsActive=true — deactivate them; plus revoke the rogue ConnectedApplication — model passes) and 7 COUNTERINTUITIVE items off the framing (clean, business-critical User accounts the broad auto-freeze wrongly caught must be reactivated to IsActive=true — model reliably omits, because it never audits the frozen list during a compromise hunt). Needles vs ungraded keepers are non-separable by any single field; the frozen bucket holds both the 4 compromised keepers and the 7 clean needles, and the discriminator is a per-account join to the Sentinel confirmed-compromised list (Account entities, restated in the #security-response-on-call Slack channel): the clean accounts wrongly caught by the auto-freeze are simply absent from that confirmed list. Bidirectional grading closes the blanket cheese (deactivate/revoke-all 0.53, reactivate-all 0.47)."
authors = []
keywords = ["it-support", "salesforce", "crm", "connected-app", "oauth-token-theft", "data-exfiltration", "account-takeover", "incident-response", "user-deactivation", "needle-field", "bidirectional"]

