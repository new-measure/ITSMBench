services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "aws-vpc,infoblox-nios,microsoft-sentinel,pagerduty,servicenow"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - aws-vpc.local.mock
          - infoblox-nios.local.mock
          - microsoft-sentinel.local.mock
          - pagerduty.local.mock
          - servicenow.local.mock
          - search.local.mock
