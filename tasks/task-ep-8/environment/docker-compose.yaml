services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "aws-vpc,device42,jira-service-management,microsoft-defender,microsoft-sentinel"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - aws-vpc.local.mock
          - device42.local.mock
          - jira-service-management.local.mock
          - microsoft-defender.local.mock
          - microsoft-sentinel.local.mock
          - search.local.mock
