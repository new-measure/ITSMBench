services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "aws-audit-manager,gmail,jira-service-management,slack,vanta"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - aws-audit-manager.local.mock
          - gmail.local.mock
          - jira-service-management.local.mock
          - slack.local.mock
          - vanta.local.mock
          - search.local.mock
