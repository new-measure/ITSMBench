services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "jumpcloud,okta,crowdstrike,sentinelone,device42,servicenow"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - jumpcloud.local.mock
          - okta.local.mock
          - crowdstrike.local.mock
          - sentinelone.local.mock
          - device42.local.mock
          - servicenow.local.mock
          - search.local.mock
