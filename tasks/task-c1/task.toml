[task]
name = "taskgen/task-c1"
description = "Active business email compromise. An attacker consent-phished a rogue OAuth app and is operating several hijacked employee mailboxes (fraudulent remittance mail + exfiltration via forwarding/delegation). Okta's impossible-travel auto-containment fired and suspended a batch of accounts, but it MISSED several still-active hijacked accounts and WRONGLY suspended clean, business-critical accounts that only signed in from Acme's overseas VPN pops. The responder must both lock down the accounts the attacker still controls (suspend + revoke rogue API token + neutralize the rogue OAuth app + scrub the headline mailbox) AND release the clean accounts the auto-lockout wrongly caught — a counterintuitive, off-path re-enable the offensive framing never prompts."
authors = []
keywords = ["it-support", "incident-response", "business-email-compromise", "okta", "gmail", "account-lockdown", "auto-lockout-false-positive", "bidirectional"]

[metadata]
environment = "it-support-bench"
category = "it-support"
scenario = "bec-account-lockdown-and-wrongful-auto-lockout-release"
tested_trait = "contain-the-active-compromise-while-releasing-clean-accounts-a-blast-radius-auto-lockout-wrongly-suspended"

