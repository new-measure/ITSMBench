[task]
name = "taskgen/task-c2"
description = "Microsoft Intune (MDM) weaponized for endpoint persistence, where the malicious app one user noticed is only the symptom. Over Vireo Dynamics' SOC2 change-freeze weekend, an intruder with Intune-admin access planted a malicious required Win32 app ('Endpoint Health Service') on the Design team — its install command silently pulls a payload from a lookalike domain into C:\\ProgramData\\VireoSync — dropped a broad security-weakening configuration profile assigned to all devices, and — the deciding move — TAMPERED the trusted, long-standing 'Corporate Windows Security Baseline' (assigned to every device): disabled Defender real-time protection and added a Defender folder exclusion for the payload directory. Removing the app and quarantining the reported device is within reach of a competent responder, but is INSUFFICIENT while the baseline stays tampered — every Windows endpoint then runs with real-time protection off and a carve-out that lets the payload execute undetected, fleet-wide. There is no Intune audit/actor log (mirroring the real forensic gap for API-made MDM changes); the intrusion is recognized from the symptom, the change-freeze corroboration in Slack, and the malicious CONTENT of the objects. The pass/fail pivots on the unprompted forensic leap that an MDM compromise means auditing the trusted configuration baselines' security settings for tampering — not just removing the newly-created malicious objects — then escalating the compromise as an incident."
authors = []
keywords = ["it-support", "incident-response", "endpoint-management", "microsoft-intune", "mdm-compromise", "defender-tamper", "configuration-profile-tampering", "fleet-persistence", "malicious-win32-app"]

