services:
  main:
    depends_on:
      - mock-api

  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "servicenow,okta,slack,slack-admin,gmail,google-workspace"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - servicenow.local.mock
          - okta.local.mock
          - slack.local.mock
          - slack-admin.local.mock
          - gmail.local.mock
          - google-workspace.local.mock
          - search.local.mock
