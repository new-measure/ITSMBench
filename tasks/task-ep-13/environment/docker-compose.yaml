services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "microsoft-teams,outlook-calendar,servicenow,slack-admin,zoom-admin"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - microsoft-teams.local.mock
          - outlook-calendar.local.mock
          - servicenow.local.mock
          - slack-admin.local.mock
          - zoom-admin.local.mock
          - search.local.mock
