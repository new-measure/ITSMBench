[task]
name = "taskgen/task-b4"
description = "Confluence insider data-exfiltration exposure lockdown, graded as a BIDIRECTIONAL needle-field at volume on per-space access (space role-assignments). A live incident (Sentinel #5183, restated in Slack #security-response-on-call): a contractor burner account plus over-broad groups (All Employees, External Contractors) were granted access to the four crown-jewel spaces (Executive, Finance, Security, Privileged Administrators) during the exfil window; those grants are live and must be REMOVED (7 restrict end-states = 2 floors + 5 needles, on-path, the model reliably does them). Separately, a broad emergency DLP auto-revocation (rule DLP-EXFIL-CONTAIN-BROAD, logged on an event-log page in the IT Support space) wrongly yanked legitimate team access on six UNRELATED spaces; those grants must be RESTORED (7 restore end-states, off the exfil path and against the safety prior, the model reliably skips them). The same principal (All Employees) is rogue on the sensitive spaces but legitimate on the All Employees space, so a blanket decision fails one direction. Bidirectional grading caps blanket revoke-all and restore-all at ~0.50; the intended landing is on-path restricts pass + off-path restores omitted (~0.5)."
authors = []
keywords = ["it-support", "confluence", "access-control", "space-permissions", "data-exfiltration", "insider-threat", "incident-response", "bidirectional-needle-field"]

