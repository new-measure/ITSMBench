services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "salesforce,hubspot,pagerduty,servicenow,freshdesk,slack"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - salesforce.local.mock
          - hubspot.local.mock
          - pagerduty.local.mock
          - servicenow.local.mock
          - freshdesk.local.mock
          - slack.local.mock
          - search.local.mock
