services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "entra-id,jira-service-management,sharepoint,onedrive,microsoft-365,github"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - entra-id.local.mock
          - jira-service-management.local.mock
          - sharepoint.local.mock
          - onedrive.local.mock
          - microsoft-365.local.mock
          - github.local.mock
          - search.local.mock
