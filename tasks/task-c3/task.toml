[task]
name = "taskgen/task-c3"
description = "Okta help-desk social-engineering account-takeover containment, graded as a bidirectional needle-field at volume on the user `status` field. An offensively-framed active incident (lock down every confirmed-compromised identity) hides two directions of the same primitive: 7 ON-PATH items the framing prompts (confirmed-compromised accounts the overnight SOAR auto-suspend missed are still ACTIVE — suspend/deprovision them, model passes) and 7 COUNTERINTUITIVE items off the framing (clean, business-critical accounts the broad auto-suspend wrongly caught must be re-activated to ACTIVE — model reliably omits, because it never audits the suspended list during a compromise hunt). Needles vs ungraded keepers are non-separable by any single field; the SUSPENDED bucket holds both the 4 compromised keepers and the 7 clean needles, and the discriminator is a per-account join to the Sentinel confirmed-compromised list plus the okta system-log ATO fingerprint the clean accounts lack. Bidirectional grading closes the blanket cheese (suspend-all 0.50, reactivate-all 0.50)."
authors = []
keywords = ["it-support", "okta", "identity", "account-takeover", "help-desk-social-engineering", "incident-response", "mfa-reset", "user-lifecycle", "needle-field", "bidirectional"]

[metadata]
environment = "it-support-bench"
category = "it-support"
scenario = "okta-ato-bidirectional-lockdown-reenable"
difficulty_mechanisms = ["bidirectional-needle-field-at-volume", "counterintuitive-undo-omission", "offensive-framing-blindspot", "account-to-compromised-list-join", "blanket-cheese-closed-both-directions"]

