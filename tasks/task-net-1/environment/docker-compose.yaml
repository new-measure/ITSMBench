services:
  main:
    depends_on:
      - mock-api

  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "servicenow,device42,infoblox-nios,haproxy,zscaler-zia,aws-vpc"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - servicenow.local.mock
          - device42.local.mock
          - infoblox-nios.local.mock
          - haproxy.local.mock
          - zscaler-zia.local.mock
          - aws-vpc.local.mock
          - search.local.mock
