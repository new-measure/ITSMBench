services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "confluence,device42,github,jira-service-management,okta"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - confluence.local.mock
          - device42.local.mock
          - github.local.mock
          - jira-service-management.local.mock
          - okta.local.mock
          - search.local.mock
