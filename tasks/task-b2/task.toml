[task]
name = "taskgen/task-b2"
description = "SharePoint insider data-exfiltration exposure lockdown, graded as a BIDIRECTIONAL needle-field at volume on per-site access (a site's permissions collection, each grant with an auditable status ACTIVE|REVOKED). Ported to the b10/vanta off-path structure. A live incident (Sentinel #5207, restated in Slack #security-response-on-call): a contractor burner account plus over-broad groups (All Staff, External Contractors) were granted ACTIVE access to the four crown-jewel sites (Executive, Finance, Security, Board & Legal) during the exfil window; those grants are live and must be CUT OFF (7 restrict end-states = 2 floors + 5 needles, graded record_not_exists on {principalId,status:ACTIVE} so delete OR revoke passes; on-path, the model reliably does them). Separately, an overnight emergency-sharing-lockdown playbook keyed off a broad access-volume heuristic and SUSPENDED (status=REVOKED) legitimate team grants on six UNRELATED bystander sites; those must be RESTORED to status=ACTIVE (7 restore end-states, field_equals). NOTHING in-world names the restore-set: the four named sites carry only ACTIVE grants, so a responder who audits just those four never sees the auto-lockdown; the wrongly-suspended grants are found ONLY by sweeping every site's permissions - a full-inventory audit off the offensive framing and against the safety prior, which the model reliably skips. The same principal (All Staff) is a rogue ACTIVE grant on the sensitive sites but a legitimate REVOKED grant on the All Company site, so a blanket decision fails one direction. Bidirectional grading caps blanket cut-off-all and restore-all at ~0.50; the intended landing is on-path restricts pass + off-path restores omitted (~0.5)."
authors = []
keywords = ["it-support", "sharepoint", "access-control", "site-permissions", "data-exfiltration", "insider-threat", "incident-response", "bidirectional-needle-field"]

[metadata]
environment = "it-support-bench"
category = "it-support"
scenario = "sharepoint-exfiltration-exposure-lockdown-bidirectional-access"
