services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "bamboohr,incidentio,okta,pagerduty"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - bamboohr.local.mock
          - incidentio.local.mock
          - okta.local.mock
          - pagerduty.local.mock
          - search.local.mock
