services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "okta,github,jumpcloud,snipeit,pagerduty,jira-service-management"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - okta.local.mock
          - github.local.mock
          - jumpcloud.local.mock
          - snipeit.local.mock
          - pagerduty.local.mock
          - jira-service-management.local.mock
          - search.local.mock
