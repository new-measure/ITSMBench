[task]
name = "taskgen/task-b1"
description = "Orphaned Okta integration: a departed automation contractor left an over-privileged, externally-driven Okta service account and an SSWS API token that keeps re-granting privileged access. The reported symptom is the Privileged Administrators group re-growing despite password/session resets; the real fix requires knowing that an Okta API token is independent of the account's credentials (surviving a suspend), revoking it, deprovisioning the orphaned service account, completing the botched offboarding, and — only surfaced by a privileged-access audit — stripping an unauthorized standing SUPER_ADMIN the automation left on a live employee, then escalating to security."
authors = []
keywords = ["it-support", "incident-response", "okta", "api-token-persistence", "service-account-hygiene", "offboarding", "least-privilege"]

