services:
  main:
    depends_on:
      - mock-api

  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "servicenow,microsoft-intune,snipeit,zoom-admin,microsoft-365,crowdstrike"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - servicenow.local.mock
          - microsoft-intune.local.mock
          - snipeit.local.mock
          - zoom-admin.local.mock
          - microsoft-365.local.mock
          - crowdstrike.local.mock
          - search.local.mock
