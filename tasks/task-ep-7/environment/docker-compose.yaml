services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "microsoft-sentinel,pagerduty,sentinelone,zohodesk,zscaler-zia"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - microsoft-sentinel.local.mock
          - pagerduty.local.mock
          - sentinelone.local.mock
          - zohodesk.local.mock
          - zscaler-zia.local.mock
          - search.local.mock
