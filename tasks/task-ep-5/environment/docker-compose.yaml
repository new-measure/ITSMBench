services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "confluence,onedrive,purview,sharepoint,slack,zohodesk"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - confluence.local.mock
          - onedrive.local.mock
          - purview.local.mock
          - sharepoint.local.mock
          - slack.local.mock
          - zohodesk.local.mock
          - search.local.mock
