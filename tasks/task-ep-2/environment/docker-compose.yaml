services:
  main:
    depends_on:
      mock-api:
        condition: service_healthy

  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "bamboohr,okta,google-workspace,github,slack-admin,jira-service-management"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:8080,path:'/search?q=ping',headers:{host:'search.local.mock'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
    networks:
      default:
        aliases:
          - bamboohr.local.mock
          - okta.local.mock
          - google-workspace.local.mock
          - github.local.mock
          - slack-admin.local.mock
          - jira-service-management.local.mock
          - search.local.mock
