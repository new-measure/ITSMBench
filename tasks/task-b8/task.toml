[task]
name = "taskgen/task-b8"
description = "HAProxy storefront card-skimming incident graded as a bidirectional needle-field at volume on the live runtime server rotation (admin_state). Offensively framed: cut off the malicious serving path. 16 graded end-states in two directions - TAKE OUT the 9 rogue/compromised backends still serving (3 obvious floors + 6 that need correlating the Sentinel egress telemetry to the server list); and RETURN to ready the 7 healthy nodes an auto health-guard wrongly flapped out of rotation during the 5xx storm. The RETURN direction is fairly breadcrumbed in-world: an incident-47 comment + a Slack message in the security channel + a per-server drain_reason marker on the runtime rows tell a thorough responder the guard drained healthy capacity and the clean drained nodes should be returned once the malicious backends are cut off - none of them enumerate the 7 nodes, so the agent still runs the exfil correlation to separate clean-drained (return) from compromised-drained (leave out). Bidirectional grading closes both blanket shortcuts; needles are non-separable from keepers without the exfil correlation (drain_reason=auto-guard/5xx-flap is shared by the clean returns and some compromised drained nodes, so it is not a clean separator). Because the drained backends sit on the same runtime rotation the agent already works for the take-out, once the RETURN is discoverable a strong model reliably performs all 7, so the task scores ~1.0 - fairness is prioritized over the difficulty band for this task."
authors = []
keywords = ["it-support", "haproxy", "load-balancer", "incident-response", "web-skimming", "magecart", "server-rotation", "runtime-admin-state", "microsoft-sentinel", "bidirectional-needle-field"]

