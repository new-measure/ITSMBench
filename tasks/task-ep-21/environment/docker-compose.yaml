services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "aws-audit-manager,entra-id,entra-id-governance,jumpcloud,okta"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - aws-audit-manager.local.mock
          - entra-id.local.mock
          - entra-id-governance.local.mock
          - jumpcloud.local.mock
          - okta.local.mock
          - search.local.mock
