services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "bamboohr,entra-id,jira-service-management,okta,servicenow"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - bamboohr.local.mock
          - entra-id.local.mock
          - jira-service-management.local.mock
          - okta.local.mock
          - servicenow.local.mock
          - search.local.mock
