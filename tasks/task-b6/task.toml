[task]
name = "taskgen/task-b6"
description = "Jira Service Management service-desk account-takeover / restricted-request-access-abuse containment, graded as a bidirectional needle-field at volume on membership of the 'Tier-3 Support - Privileged Access' organisation (org 702) - the access-control org the restricted DSAR / customer-PII-export requests are shared with, so its members are the only accounts that can see/raise/act on that restricted request set (org membership governs request visibility here; it is not an agent role or permission scheme). An offensively-framed active incident (an external actor holds a cluster of Tier-3 service-desk accounts that are members of org 702 and is abusing that membership to open the restricted customer requests in bulk and exfiltrate the PII in them) hides two directions of the same primitive: 7 ON-PATH items the framing prompts (confirmed-compromised agents the overnight auto-containment missed are still members of org 702 - remove them, model passes) and 7 COUNTERINTUITIVE items off the framing (clean, business-critical agents the crude bulk-export auto-containment wrongly revoked must be added back to org 702 - model reliably omits, because it never audits the containment revocation log during a compromise hunt). Needles vs ungraded keepers are non-separable by any single field; the confirmed-compromised list (Sentinel Account entities, restated in Slack) is the join key, and the containment log (JSM request ACH-95102) enumerates who was auto-revoked, so restore = revoked-log minus confirmed. Bidirectional grading closes the blanket cheese (remove-all 0.50, restore-all 0.50)."
authors = []
keywords = ["it-support", "jira-service-management", "jsm", "service-desk", "account-takeover", "insider-abuse", "privileged-access", "incident-response", "organization-membership", "data-exfiltration", "needle-field", "bidirectional"]

[metadata]
environment = "it-support-bench"
category = "it-support"
scenario = "jsm-agent-ato-bidirectional-privileged-access-cut-restore"
difficulty_mechanisms = ["bidirectional-needle-field-at-volume", "counterintuitive-restore-omission", "offensive-framing-blindspot", "account-to-confirmed-compromised-list-join", "containment-log-off-investigation-surface", "blanket-cheese-closed-both-directions"]

