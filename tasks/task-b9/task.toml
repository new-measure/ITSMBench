[task]
name = "taskgen/task-b9"
description = "Device42 supply-chain / rogue-asset firmware compromise, graded as a bidirectional needle-field at volume on the device lifecycle `status` field. An offensively-framed active incident (a trojaned RelayOS build is beaconing to attacker C2 and rogue assets were planted; take every confirmed-compromised asset out of service) hides two directions of the same primitive: 7 ON-PATH items the framing prompts (confirmed-compromised assets the overnight Asset Quarantine Automation missed because they live off the swept subnet are still in_service - decommission them, model passes) and 7 COUNTERINTUITIVE items off the framing (clean, business-critical assets the blast-radius sweep wrongly decommissioned for merely sharing the 10.40.0.0/24 management subnet must be restored to in_service - model reliably omits, because it never audits the decommissioned list during a compromise hunt). Needles vs ungraded keepers are non-separable by any single asset field; the decommissioned bucket holds both the 4 compromised keepers and the 7 clean needles, and the discriminator is a per-asset join to the SOC confirmed-compromised Host list (C2 beacon evidence in Sentinel #5093). Bidirectional grading closes the blanket cheese (decommission-all 0.50, restore-all 0.50)."
authors = []
keywords = ["it-support", "device42", "cmdb", "asset-management", "supply-chain-compromise", "trojaned-firmware", "rogue-asset", "incident-response", "device-lifecycle", "decommission", "needle-field", "bidirectional"]

[metadata]
environment = "it-support-bench"
category = "it-support"
scenario = "device42-supplychain-bidirectional-decommission-restore"
difficulty_mechanisms = ["bidirectional-needle-field-at-volume", "counterintuitive-undo-omission", "offensive-framing-blindspot", "asset-to-confirmed-c2-list-join", "firmware-red-herring", "hostname-prefix-trap", "blanket-cheese-closed-both-directions"]

