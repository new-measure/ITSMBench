services:
  main:
    depends_on:
      - mock-api
  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "confluence,notion,notion-admin,okta,sharepoint"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - confluence.local.mock
          - notion.local.mock
          - notion-admin.local.mock
          - okta.local.mock
          - sharepoint.local.mock
          - search.local.mock
