services:
  main:
    depends_on:
      - mock-api

  mock-api:
    image: harbor.local/taskgen-emulator:a3dc8a1f0c35
    pull_policy: never
    environment:
      EMULATOR_TOOLS: "okta,entra-id,keka,servicenow,confluence,github,google-workspace,slack,microsoft-sentinel"
      MOCK_SEED_PATH: /task/seed.json
    volumes:
      - ./seed.json:/task/seed.json:ro
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - okta.local.mock
          - entra-id.local.mock
          - keka.local.mock
          - servicenow.local.mock
          - confluence.local.mock
          - github.local.mock
          - google-workspace.local.mock
          - slack.local.mock
          - microsoft-sentinel.local.mock
          - search.local.mock
