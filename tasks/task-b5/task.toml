[task]
name = "taskgen/task-b5"
description = "Microsoft Intune AiTM token-theft containment, graded as a bidirectional needle-field at volume on deviceCategoryId. An offensively-framed active incident (isolate every compromised endpoint into Security-Hold) hides two directions of the same primitive: 9 ON-PATH items the framing prompts (move compromised accounts' devices the auto-quarantine missed into Security-Hold — model passes) and 8 COUNTERINTUITIVE items off the framing (restore clean, business-critical devices the auto-quarantine wrongly caught back to a normal category — model reliably omits). Needles vs ungraded keepers are non-separable by any single field; the discriminator is a per-device join of device owner to the Sentinel compromised-account list. Bidirectional grading closes the blanket cheese (quarantine-all 0.53, restore-all 0.47)."
authors = []
keywords = ["it-support", "microsoft-intune", "mdm", "endpoint-management", "device-category", "quarantine", "containment", "token-theft", "aitm", "incident-response", "needle-field"]

